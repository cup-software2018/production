# produce_iadc settings; keys left out keep the default.  Samples of 16 ns, record 62.
# Keys and algorithm: README.md.

baseline:
  window_normal: [0, 14]        # normal triggers, in front of the pulse (diagnostic)
  window_pedestal: [0, 0]       # pedestal triggers; [0, 0] = the whole record

normal:
  integration: [16, 48]         # 99.8 % of the mean pulse
  cf: 0.5                       # constant fraction for tlead, tcf
  baseline: fit                 # fit (flat + dark pulses in window_normal) or header

pedestal:
  fit:                          # dark-pulse fit: flat level + n Moyal pulses of common width
    enabled: true
    sigma_e: 2.0                # ADC, noise per sample
    seed_height: 12.0           # ADC, smallest seed (~0.3 p.e.)
    add_residual: 8.0           # ADC, residual that tries one more pulse
    add_dchi2: 25.0             # chi2 a new pulse must buy
    max_pulses: 12
    sigma_range: [1.4, 2.4]     # samples
    mu_min: -8.0                # earliest peak position
    keep_height: 5.7            # ADC (0.15 p.e.); smaller pulses not written
