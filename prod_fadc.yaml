# produce_fadc settings; keys left out keep the default.  Samples of 2 ns, record 1008.
# Charges in ADC*sample.  Keys: README.md.

baseline:
  clip_sigma: 4.0               # one-sided pulse rejection, on the parity-subtracted deviation
  iters: 4                      # repeats of it (stops when stable)
  window_normal: [0, 200]       # normal triggers: in front of the signal; also the dark_q region
  window_pedestal: [0, 1008]    # pedestal triggers: the whole record
  exclude_pedestal: [-15, 50]   # ... minus this, relative to the peak

normal:
  integration: [232, 416]       # signal window (DLY 1100; DLY 1500: [432, 616])
  pulse:                        # 4 sigma excursions, widened by pre/post, merged, summed
    nsigma: 4.0
    pre: 3
    post: 21

pedestal:
  windows: [[2, 6], [4, 8], [6, 16], [8, 24], [10, 45]]   # (head, tail) around the peak
  hmax_range: [15, 957]         # where the peak may sit
  ped_away: 80                  # qp_* gate distance from the peak
  second_away: 20               # hmax2 excludes the peak +- this
  seed: 0                       # qp_* positions: seed + 1000*run + first subrun

channels:                       # PIDs kept per board; 48 is empty, 49 is the door PMT
  1: [1, 47]
  2: [49, 49]
